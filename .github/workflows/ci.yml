name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fonts
        shell: pwsh
        run: ./tools/Fetch-Fonts.ps1

      - name: Build Flowtype
        shell: pwsh
        run: ./tools/Build-Flowtype.ps1

      - name: Run tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1

      - name: Verify version
        shell: pwsh
        run: |
          $label = (Get-Content -Raw VERSION.txt).Trim() -replace '^Flowtype\s+',''
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo('Flowtype.exe').FileVersion
          $expected = "$label.0"
          if ($version -ne $expected) { throw "Unexpected version: $version (wanted $expected)" }
